[package]
name = "zaudioscope"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37"
serde = { version = "1.0.229", features = ["derive"] }

# Drawing scopes and running FFTs in an unoptimized build is slow.
# Optimize dependencies even in dev; our own crate stays fast to rebuild.
[profile.dev.package."*"]
opt-level = 2
