[package]
name = "zaudioscope"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37"
midir = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }

# Drawing scopes and running FFTs in an unoptimized build is slow.
# Optimize dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2

# Our own DSP (FFT, NSDF) runs every frame; opt-level 0 made the UI stutter.
# Level 1 keeps rebuilds quick.
[profile.dev]
opt-level = 1

# coremidi 0.9.2 makes a `&Packet` from CoreMIDI's packet list, which can sit
# at an unaligned address; debug builds abort on that. Same fix as KitPool.
[profile.dev.package.coremidi]
debug-assertions = false
